<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title data-i18n="web.login.panel_hogar">Panel Hogar</title>
  <!-- Iconos Material Design. El script de instalación los descarga a vendor/ para funcionar sin internet. -->
  <link rel="stylesheet" href="vendor/mdi/css/materialdesignicons.min.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css'">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" onerror="window.PANEL_CONFIG = null"></script>
  <!-- Configuración guardada desde la web del ayudante de la Pi (manda sobre config.js) -->
  <script src="boot.js"></script>
  <script src="translations/i18n.js"></script>
    <script src="lib/qrcode.js" defer></script>
  <script src="lib/modules.js" defer></script>
  <script src="lib/components.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Pantalla ambiente (reloj / fotos) cuando nadie toca el panel -->
  <div id="ambient" class="ambient">
    <div class="amb-bg" id="amb-bg-a"><div class="amb-blur"></div><div class="amb-fg"></div></div>
    <div class="amb-bg" id="amb-bg-b"><div class="amb-blur"></div><div class="amb-fg"></div></div>
    <div class="amb-caption" id="amb-caption"></div>
    <!-- Pasar a la siguiente foto (solo se ve si hay fotos) -->
    <button class="amb-next hidden" id="amb-next" title="Next photo"><i class="mdi mdi-chevron-right"></i></button>
    <!-- Controles del altavoz por defecto -->
    <div class="amb-player hidden" id="amb-player"></div>
    <div class="amb-content">
      <div class="amb-clock" id="amb-clock">--:--</div>
      <div class="amb-date" id="amb-date"></div>
      <div class="amb-chips" id="amb-chips"></div>
    </div>
  </div>

  <!-- Sonando: lo que suena en el altavoz del panel (Music Assistant), a pantalla completa -->
  <div id="np" class="np"></div>
  <!-- Código para emparejar el altavoz con Music Assistant (mientras lo pide) -->
  <div id="pin" class="pin-ov"></div>

  <div id="app">
    <nav id="rail"></nav>
    <main>
      <header id="topbar">
        <div id="view-title"></div>
        <div class="top-right">
          <button id="bell" class="bell hidden" title="Notifications"><i class="mdi mdi-bell"></i><span id="bell-count"></span></button>
          <span id="weather-mini"></span>
          <span id="clock-mini">--:--</span>
          <span id="conn" class="conn" title="Connection to Home Assistant"></span>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <!-- Panel de acceso rápido: baja desde el borde de arriba (o con el botón ⋮) -->
  <div id="shade-bg" class="shade-bg"></div>
  <div id="shade" class="shade"><div id="shade-in" class="shade-in"></div><div class="shade-grip"></div></div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-card" id="sheet-card"></div>
  </div>

  <!-- Avisos enviados desde Home Assistant (event: panel_notificacion) -->
  <div id="alert" class="alert hidden"><div class="alert-card" id="alert-card"></div></div>
  <div id="banner" class="banner"></div>

  <!-- Alarma sonando -->
  <div id="ring" class="ring-overlay hidden"></div>

  <!-- Asistente de voz: barra abajo, encima de cualquier pantalla -->
  <div id="voice" class="voice"></div>

  <div id="toast" class="toast"></div>
  <div id="dim"></div>
  <!-- Pantalla "apagada" (si hay ayudante, además se apaga de verdad) -->
  <div id="blackout" class="blackout hidden"></div>
</body>
</html>
