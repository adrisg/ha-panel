<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Panel Hogar</title>
  <!-- Iconos Material Design. El script de instalación los descarga a vendor/ para funcionar sin internet. -->
  <link rel="stylesheet" href="vendor/mdi/css/materialdesignicons.min.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css'">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" onerror="window.PANEL_CONFIG = null"></script>
  <!-- Configuración guardada desde la web del ayudante de la Pi (manda sobre config.js) -->
  <script src="boot.js"></script>
  <script src="lib/qrcode.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Pantalla ambiente (reloj / fotos) cuando nadie toca el panel -->
  <div id="ambient" class="ambient">
    <div class="amb-bg" id="amb-bg-a"></div>
    <div class="amb-bg" id="amb-bg-b"></div>
    <div class="amb-caption" id="amb-caption"></div>
    <!-- Pasar a la siguiente foto (solo se ve si hay fotos) -->
    <button class="amb-next hidden" id="amb-next" title="Siguiente foto"><i class="mdi mdi-chevron-right"></i></button>
    <!-- Controles del altavoz por defecto -->
    <div class="amb-player hidden" id="amb-player"></div>
    <div class="amb-content">
      <div class="amb-clock" id="amb-clock">--:--</div>
      <div class="amb-date" id="amb-date"></div>
      <div class="amb-chips" id="amb-chips"></div>
    </div>
  </div>

  <div id="app">
    <nav id="rail"></nav>
    <main>
      <header id="topbar">
        <div id="view-title"></div>
        <div class="top-right">
          <button id="bell" class="bell hidden" title="Avisos"><i class="mdi mdi-bell"></i><span id="bell-count"></span></button>
          <span id="weather-mini"></span>
          <span id="clock-mini">--:--</span>
          <span id="conn" class="conn" title="Conexión con Home Assistant"></span>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <!-- Ajustes: engranaje flotante y discreto abajo a la derecha -->
  <button id="settings-btn" class="fab-settings" title="Ajustes"><i class="mdi mdi-cog"></i></button>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-card" id="sheet-card"></div>
  </div>

  <!-- Avisos enviados desde Home Assistant (event: panel_notificacion) -->
  <div id="alert" class="alert hidden"><div class="alert-card" id="alert-card"></div></div>
  <div id="banner" class="banner"></div>

  <!-- Alarma sonando -->
  <div id="ring" class="ring-overlay hidden"></div>

  <div id="toast" class="toast"></div>
  <div id="dim"></div>
  <!-- Pantalla "apagada" (si hay ayudante, además se apaga de verdad) -->
  <div id="blackout" class="blackout hidden"></div>
</body>
</html>
